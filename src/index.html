<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Claude Usage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The header is the drag handle. CSS `-webkit-app-region: drag`
       makes the whole bar grab-and-move; the close button overrides
       it back to a clickable area so dragging doesn't swallow it. -->
  <header id="drag">
    <span class="title">Claude Code</span>
    <span class="scanned" id="scanned">—</span>
    <button class="iconbtn" id="menu" title="Menu">⋯</button>
  </header>

  <section id="quota" title="Subscription quota — live from api.anthropic.com/api/oauth/usage">
    <div class="empty">—</div>
  </section>

  <section id="chart-wrap" title="Throughput — new work per minute, last 4h in 5-min buckets">
    <div class="chart-head">
      <span class="lbl">last 4h</span>
      <span class="peak" id="chart-peak">peak —</span>
    </div>
    <svg id="chart" viewBox="0 0 200 40" preserveAspectRatio="none"></svg>
  </section>

  <footer id="totals">Today: — · — msg</footer>

  <script src="renderer.js"></script>
</body>
</html>
