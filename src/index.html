<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Claude + Codex Usage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="peek-defs" aria-hidden="true">
    <defs>
      <filter id="trail-soften" filterUnits="userSpaceOnUse" x="-100" y="-100" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8" />
      </filter>
      <mask id="trail-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%" style="mask-type: luminance">
        <rect width="100%" height="100%" fill="white" />
        <!-- Group opacity caps the cutout even where strokes overlap. -->
        <g opacity="0.42">
          <g id="trail-strokes" fill="none" stroke="black" stroke-linecap="round" filter="url(#trail-soften)"></g>
        </g>
        <rect id="trail-header" width="100%" fill="white" />
      </mask>
    </defs>
  </svg>
  <!-- Click-through widget (main.js): only the ⋯ button takes clicks.
       The header becomes a drag handle only while unlocked via the menu.
       No title= tooltips — hover never reaches them. -->
  <header id="drag">
    <span class="title">Claude + Codex</span>
    <span class="scanned" id="scanned">—</span>
    <button class="iconbtn" id="menu">⋯</button>
  </header>

  <div class="provider-title">Claude Code</div>
  <section id="quota" class="quota">
    <div class="empty">—</div>
  </section>

  <div class="provider-title codex-title">Codex <span id="codex-plan"></span></div>
  <section id="codex-quota" class="quota">
    <div class="empty">Wird geladen …</div>
  </section>

  <!-- Claude throughput: 4h sparkline (5-min buckets) + absolute numbers. -->
  <section id="foot">
    <svg id="chart" viewBox="0 0 200 40" preserveAspectRatio="none"></svg>
    <div class="fstats">
      <div id="totals">heute — tok · — msg</div>
      <div id="rate">jetzt — · peak —</div>
    </div>
  </section>

  <script src="pace.js"></script>
  <script src="mbview.js"></script>
  <div id="grip"></div>
<script src="renderer.js"></script>
</body>
</html>
